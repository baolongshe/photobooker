<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付宝支付 - PhotoBooker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .payment-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: #1677ff;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1677ff;
        }

        .amount-display {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 18px;
            color: #1677ff;
            font-weight: bold;
        }

        .pay-button {
            background: linear-gradient(45deg, #1677ff, #4096ff);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-top: 20px;
        }

        .pay-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(22, 119, 255, 0.3);
        }

        .pay-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .status.success {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #52c41a;
        }

        .status.error {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1677ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <div class="logo">📸</div>
        <h1>支付宝支付</h1>
        
        <form id="paymentForm">
            <div class="form-group">
                <label for="orderId">订单号</label>
                <input type="text" id="orderId" name="orderId" value="ORDER20250101001" readonly>
            </div>
            
            <div class="form-group">
                <label for="packageType">选择套餐</label>
                <select id="packageType" name="packageType" onchange="updateAmount()">
                    <option value="">请选择套餐</option>
                    <option value="basic" data-price="299">基础写真套餐 - ¥299</option>
                    <option value="standard" data-price="599">标准写真套餐 - ¥599</option>
                    <option value="premium" data-price="999">高级写真套餐 - ¥999</option>
                    <option value="wedding" data-price="1999">婚纱摄影套餐 - ¥1999</option>
                </select>
            </div>
            
            <div class="amount-display" id="amountDisplay">
                请选择套餐查看价格
            </div>
            
            <button type="button" class="pay-button" id="payButton" onclick="createPayment()" disabled>
                立即支付
            </button>
        </form>
        
        <div class="status" id="status"></div>
    </div>

    <script>
        // 更新金额显示
        function updateAmount() {
            const select = document.getElementById('packageType');
            const amountDisplay = document.getElementById('amountDisplay');
            const payButton = document.getElementById('payButton');
            
            if (select.value) {
                const option = select.options[select.selectedIndex];
                const price = option.getAttribute('data-price');
                amountDisplay.textContent = `支付金额：¥${price}`;
                payButton.disabled = false;
            } else {
                amountDisplay.textContent = '请选择套餐查看价格';
                payButton.disabled = true;
            }
        }

        // 生成随机订单号
        function generateOrderId() {
            const timestamp = new Date().getTime();
            const random = Math.floor(Math.random() * 1000);
            return `ORDER${timestamp}${random}`;
        }

        // 创建支付订单
        async function createPayment() {
            const orderId = document.getElementById('orderId').value;
            const packageType = document.getElementById('packageType').value;
            const select = document.getElementById('packageType');
            const option = select.options[select.selectedIndex];
            const totalAmount = option.getAttribute('data-price');
            
            const payButton = document.getElementById('payButton');
            const status = document.getElementById('status');
            
            // 显示加载状态
            payButton.innerHTML = '<span class="loading"></span>正在创建支付...';
            payButton.disabled = true;
            status.style.display = 'none';
            
            try {
                // 调用后端支付接口
                const formData = new FormData();
                formData.append('orderId', orderId);
                formData.append('totalAmount', totalAmount);
                
                const response = await fetch('http://localhost:8099/pay/create', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    const result = await response.text();
                    showStatus('success', '支付表单生成成功！');
                    
                    // 将支付表单插入到页面中
                    const paymentContainer = document.querySelector('.payment-container');
                    const formDiv = document.createElement('div');
                    formDiv.innerHTML = result;
                    formDiv.style.display = 'none';
                    paymentContainer.appendChild(formDiv);
                    
                    // 自动提交表单，跳转到支付宝支付页面
                    setTimeout(() => {
                        const form = formDiv.querySelector('form');
                        if (form) {
                            form.submit();
                        }
                    }, 1000);
                    
                } else {
                    throw new Error('支付创建失败');
                }
                
            } catch (error) {
                console.error('支付错误:', error);
                showStatus('error', '支付失败：' + error.message);
            } finally {
                // 恢复按钮状态
                payButton.innerHTML = '立即支付';
                payButton.disabled = false;
            }
        }

        // 显示状态信息
        function showStatus(type, message) {
            const status = document.getElementById('status');
            status.className = `status ${type}`;
            status.textContent = message;
            status.style.display = 'block';
        }

        // 页面加载时处理URL参数
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('orderId');
            const totalAmount = urlParams.get('totalAmount');
            const packageName = urlParams.get('packageName');
            
            if (orderId) {
                document.getElementById('orderId').value = orderId;
            } else {
                document.getElementById('orderId').value = generateOrderId();
            }
            
            if (totalAmount && packageName) {
                // 根据套餐名称设置选择框
                const select = document.getElementById('packageType');
                const options = select.options;
                for (let i = 0; i < options.length; i++) {
                    if (options[i].text.includes(packageName)) {
                        select.selectedIndex = i;
                        updateAmount();
                        break;
                    }
                }
            }
        };
    </script>
</body>
</html>
