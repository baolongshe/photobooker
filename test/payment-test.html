<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付测试 - PhotoBooker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .test-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .test-form {
            text-align: left;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1677ff;
        }

        .test-button {
            background: linear-gradient(45deg, #1677ff, #4096ff);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-top: 20px;
        }

        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(22, 119, 255, 0.3);
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .result.success {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #52c41a;
        }

        .result.error {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1677ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>支付模块测试</h1>
        
        <div class="test-form">
            <div class="form-group">
                <label for="orderId">订单号</label>
                <input type="text" id="orderId" value="123456789" readonly>
            </div>
            
            <div class="form-group">
                <label for="totalAmount">支付金额</label>
                <input type="number" id="totalAmount" value="299" step="0.01">
            </div>
            
            <div class="form-group">
                <label for="testType">测试类型</label>
                <select id="testType">
                    <option value="create">创建支付</option>
                    <option value="notify">模拟异步通知</option>
                    <option value="return">模拟同步回调</option>
                </select>
            </div>
        </div>
        
        <button class="test-button" onclick="runTest()">
            运行测试
        </button>
        
        <div class="result" id="result"></div>
    </div>

    <script>
        async function runTest() {
            const orderId = document.getElementById('orderId').value;
            const totalAmount = document.getElementById('totalAmount').value;
            const testType = document.getElementById('testType').value;
            const result = document.getElementById('result');
            
            result.style.display = 'none';
            
            try {
                switch (testType) {
                    case 'create':
                        await testCreatePayment(orderId, totalAmount);
                        break;
                    case 'notify':
                        await testNotify(orderId, totalAmount);
                        break;
                    case 'return':
                        await testReturn(orderId, totalAmount);
                        break;
                }
            } catch (error) {
                showResult('error', '测试失败：' + error.message);
            }
        }

        async function testCreatePayment(orderId, totalAmount) {
            const formData = new FormData();
            formData.append('orderId', orderId);
            formData.append('totalAmount', totalAmount);
            
            console.log('发送的参数:', { orderId, totalAmount });
            
            const response = await fetch('http://localhost:8099/pay/create', {
                method: 'POST',
                body: formData
            });
            
            console.log('响应状态:', response.status);
            console.log('响应头:', response.headers);
            
            if (response.ok) {
                const result = await response.text();
                console.log('响应内容:', result);
                showResult('success', '支付表单生成成功！表单内容：' + result.substring(0, 200) + '...');
            } else {
                const errorText = await response.text();
                console.error('错误响应:', errorText);
                throw new Error('支付创建失败: ' + errorText);
            }
        }

        async function testNotify(orderId, totalAmount) {
            const notifyData = {
                out_trade_no: orderId,
                total_amount: totalAmount,
                trade_status: 'TRADE_SUCCESS',
                sign: 'test_sign'
            };
            
            const response = await fetch('http://localhost:8099/pay/notify', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: new URLSearchParams(notifyData)
            });
            
            const result = await response.text();
            showResult('success', '异步通知测试完成，返回：' + result);
        }

        async function testReturn(orderId, totalAmount) {
            const returnUrl = `http://localhost:8099/pay/return?out_trade_no=${orderId}&total_amount=${totalAmount}`;
            showResult('success', '同步回调测试，应该跳转到：' + returnUrl);
            
            // 模拟跳转
            setTimeout(() => {
                window.location.href = returnUrl;
            }, 2000);
        }

        function showResult(type, message) {
            const result = document.getElementById('result');
            result.className = `result ${type}`;
            result.textContent = message;
            result.style.display = 'block';
        }
    </script>
</body>
</html>
